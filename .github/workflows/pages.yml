name: Publicar página en GitHub Pages

# Publica el contenido de docs/ en la rama gh-pages.
# GitHub Pages sirve esa rama en:
# https://henderseedsrepositorio.github.io/Campa-aMKT-26-27/

on:
  push:
    branches: [claude/peaceful-sagan-srghou]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
