name: Publicar página en GitHub Pages

# Publica el contenido de docs/ en GitHub Pages.
# https://henderseedsrepositorio.github.io/Campa-aMKT-26-27/

on:
  push:
    branches: [claude/peaceful-sagan-srghou]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy a Pages
        id: deployment
        uses: actions/deploy-pages@v4
