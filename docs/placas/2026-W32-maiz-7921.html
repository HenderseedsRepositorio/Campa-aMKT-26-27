<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1350">
<title>NS 7921 VIPTERA3 CL — Henderseeds Maíz</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=DM+Sans:wght@400;500;700&family=DM+Mono&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1350px;overflow:hidden;background:#0A0F1B;font-family:'DM Sans',sans-serif;color:#fff;position:relative}
.grid{display:grid;grid-template-rows:auto 1fr auto;height:100%;padding:50px 60px}
.top{display:flex;justify-content:space-between;align-items:center}
.logo{height:40px}
.hero{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.hybrid{font-family:'Archivo Black',sans-serif;font-size:140px;line-height:1;letter-spacing:-2px;background:linear-gradient(180deg,#fff 0%,#A0B4D0 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hybrid span{display:block;font-size:48px;letter-spacing:8px;color:#F5A623;-webkit-text-fill-color:#F5A623;margin-bottom:10px}
.tagline{font-size:28px;color:#A0B4D0;margin-top:15px;letter-spacing:1px}
.stats{display:flex;gap:60px;margin-top:50px}
.stat{text-align:center}
.stat .number{font-family:'Archivo Black',sans-serif;font-size:72px;color:#F5A623;line-height:1}
.stat .label{font-size:18px;color:#A0B4D0;margin-top:8px;text-transform:uppercase;letter-spacing:2px}
.stat .sub{font-size:14px;color:#556;margin-top:4px}
.features{display:flex;gap:30px;margin-top:40px}
.feature{background:rgba(245,166,35,0.08);border:1px solid rgba(245,166,35,0.2);padding:12px 24px;border-radius:8px;font-size:16px;color:#F5A623;font-family:'DM Mono',monospace;letter-spacing:1px}
.footer{display:flex;justify-content:space-between;align-items:flex-end;padding-bottom:10px}
.footer .cta{font-family:'DM Mono',monospace;font-size:14px;color:#F5A623;letter-spacing:3px;text-transform:uppercase}
.footer .logos{display:flex;gap:30px;align-items:center}
.footer .logos img{height:28px;opacity:0.7}
.corner-data{position:absolute;top:50px;right:60px;font-family:'DM Mono',monospace;font-size:13px;color:#334;text-align:right;line-height:1.6}
</style>
</head>
<body>
<div class="corner-data">
  PRECAMPAÑA 26/27<br>
  MAÍZ · CAMPAÑA GRUESA<br>
  RÍO QUINTO · 15/08/2026
</div>
<div class="grid">
  <div class="top">
    <img class="logo" src="../../assets/logo-henderseeds-white.png" alt="Henderseeds">
    <img class="logo" src="../../assets/logo-nidera.png" alt="Nidera" style="height:32px">
  </div>
  <div class="hero">
    <div class="hybrid">
      <span>MAÍZ</span>
      7921
    </div>
    <div class="tagline">VIPTERA3 CL · TRES HERBICIDAS, UNA SOLUCIÓN</div>
    <div class="stats">
      <div class="stat">
        <div class="number">+179</div>
        <div class="label">kg/ha**</div>
        <div class="sub">vs testigo</div>
      </div>
      <div class="stat">
        <div class="number">60%</div>
        <div class="label">éxito</div>
        <div class="sub">por encima del testigo</div>
      </div>
      <div class="stat">
        <div class="number">3</div>
        <div class="label">herbicidas</div>
        <div class="sub">glifosato + glufosinato + ALS</div>
      </div>
    </div>
    <div class="features">
      <div class="feature">GLIFOSATO</div>
      <div class="feature">GLUFOSINATO</div>
      <div class="feature">ALS / IMIDAZOLINONAS</div>
    </div>
  </div>
  <div class="footer">
    <div class="cta">→ HABLANOS POR WHATSAPP</div>
    <div class="logos">
      <img src="../../assets/logo-henderseeds-white.png" alt="Henderseeds">
      <span style="color:#334;font-size:13px">+</span>
      <img src="../../assets/logo-nidera.png" alt="Nidera">
    </div>
  </div>
</div>
</body>
</html>
