<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HenderSeeds — Placa 9 de Julio · Día de la Independencia</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
:root {
  --navy:#0A0F1B; --navy-2:#0D2D5E; --cream:#F6F4EE;
  --orange:#F5A623; --celeste:#74ACDF; --white:#E8EEF7; --grey:#8FA0BE;
  --mono:'DM Mono',monospace; --sans:'DM Sans',sans-serif; --arch:'Archivo Black',sans-serif;
}
body { background:#05070d; display:flex; justify-content:center; align-items:flex-start; padding:20px; }
.slide {
  width:1080px; height:1350px; background:var(--navy);
  position:relative; overflow:hidden; padding:100px 80px 90px;
  display:flex; flex-direction:column; flex-shrink:0;
}
.slide::after {
  content:''; position:absolute; inset:0;
  background-image:
    linear-gradient(rgba(116,172,223,0.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(116,172,223,0.05) 1px, transparent 1px);
  background-size:60px 60px; pointer-events:none;
}
/* franja bandera arriba */
.flag { position:absolute; top:0; left:0; right:0; height:14px; display:flex; z-index:10; }
.flag span { flex:1; }
.flag .c { background:var(--celeste); }
.flag .b { background:#fff; }

.corner { position:absolute; width:34px; height:34px; border-color:rgba(116,172,223,0.25); border-style:solid; z-index:5; }
.corner-br { bottom:34px; right:34px; border-width:0 2px 2px 0; }

.logo-hs { position:absolute; top:84px; left:80px; height:62px; z-index:6; }
.kicker {
  font-family:var(--mono); font-size:20px; letter-spacing:3px; text-transform:uppercase;
  color:var(--celeste); display:flex; align-items:center; gap:12px; z-index:2; align-self:flex-end;
}
.led { width:11px; height:11px; border-radius:50%; background:var(--celeste); box-shadow:0 0 14px rgba(116,172,223,0.7); }

.spacer { flex:1; }

.sol { z-index:2; margin-bottom:44px; filter:drop-shadow(0 0 26px rgba(245,166,35,0.35)); }

.fecha-line { font-family:var(--mono); font-size:24px; letter-spacing:4px; text-transform:uppercase; color:var(--celeste); z-index:2; margin-bottom:22px; }
.title { font-family:var(--arch); color:#fff; font-size:92px; line-height:1.04; letter-spacing:-2px; z-index:2; }
.title .hl { color:var(--celeste); }
.subtitle { font-family:var(--sans); font-size:34px; font-weight:500; color:var(--white); opacity:.92; line-height:1.45; margin-top:36px; z-index:2; max-width:880px; }
.subtitle b { color:var(--orange); font-weight:700; }
.zona { font-family:var(--mono); font-size:21px; letter-spacing:3.5px; text-transform:uppercase; color:var(--grey); margin-top:44px; z-index:2; }

.footrow { display:flex; justify-content:space-between; align-items:center; margin-top:60px; padding-top:28px; border-top:1px dashed rgba(232,238,247,0.18); z-index:2; }
.redin-logo { display:flex; align-items:center; gap:14px; }
.redin-logo img { height:30px; background:#fff; padding:6px 10px; border-radius:7px; }
.redin-logo span { font-family:var(--mono); font-size:17px; letter-spacing:1.5px; color:var(--grey); text-transform:uppercase; }
.ig-min { font-family:var(--mono); font-size:19px; letter-spacing:1px; color:var(--grey); }
</style>
</head>
<body>
<div class="slide">
  <div class="flag"><span class="c"></span><span class="b"></span><span class="c"></span></div>
  <img class="logo-hs" src="../assets/logo-henderseeds-white.png" alt="HenderSeeds">
  <div class="kicker"><span class="led"></span> Efeméride · Argentina</div>

  <div class="spacer"></div>

  <!-- Sol de mayo -->
  <svg class="sol" width="170" height="170" viewBox="0 0 100 100" fill="none" aria-hidden="true">
    <g stroke="#F5A623" stroke-width="2.6" stroke-linecap="round">
      <line x1="50" y1="4"  x2="50" y2="20"/>
      <line x1="50" y1="80" x2="50" y2="96"/>
      <line x1="4"  y1="50" x2="20" y2="50"/>
      <line x1="80" y1="50" x2="96" y2="50"/>
      <line x1="17.5" y1="17.5" x2="28.8" y2="28.8"/>
      <line x1="71.2" y1="71.2" x2="82.5" y2="82.5"/>
      <line x1="17.5" y1="82.5" x2="28.8" y2="71.2"/>
      <line x1="71.2" y1="28.8" x2="82.5" y2="17.5"/>
      <line x1="32" y1="7.6" x2="38" y2="21.8" stroke-width="1.8"/>
      <line x1="62" y1="78.2" x2="68" y2="92.4" stroke-width="1.8"/>
      <line x1="7.6" y1="68" x2="21.8" y2="62" stroke-width="1.8"/>
      <line x1="78.2" y1="38" x2="92.4" y2="32" stroke-width="1.8"/>
      <line x1="7.6" y1="32" x2="21.8" y2="38" stroke-width="1.8"/>
      <line x1="78.2" y1="62" x2="92.4" y2="68" stroke-width="1.8"/>
      <line x1="32" y1="92.4" x2="38" y2="78.2" stroke-width="1.8"/>
      <line x1="62" y1="21.8" x2="68" y2="7.6" stroke-width="1.8"/>
    </g>
    <circle cx="50" cy="50" r="21" stroke="#F5A623" stroke-width="3"/>
    <circle cx="50" cy="50" r="12" fill="#F5A623" opacity="0.9"/>
  </svg>

  <div class="fecha-line">9 de Julio · 1816 — 2026</div>
  <div class="title">Feliz Día de la<br><span class="hl">Independencia</span></div>
  <div class="subtitle"><b>210 años</b> de un país que se construye trabajando la tierra. Feliz día para cada productor que lo sigue empujando, campaña tras campaña.</div>

  <div class="zona">Henderson · Daireaux · Bolívar</div>

  <div class="footrow">
    <div class="redin-logo">
      <img src="../assets/logo-nidera.png" alt="Nidera Semillas">
      <span>RED.IN · Nidera Semillas</span>
    </div>
    <div class="ig-min">@henderseeds</div>
  </div>

  <span class="corner corner-br"></span>
</div>

<div class="dlbar" style="display:none">
  <button class="btn-dl" data-fmt="feed">Descargar feed &middot; 4:5</button>
  <button class="btn-dl" data-fmt="historia">Descargar historia &middot; 9:16</button>
</div>

<style>
.dlbar { position:fixed; bottom:24px; right:24px; z-index:9999; display:flex; flex-direction:column; gap:10px; }
.btn-dl {
  font-family:'DM Mono',monospace; font-size:14px; font-weight:500;
  background:#F5A623; color:#0A0F1B; border:none; border-radius:10px;
  padding:13px 22px; cursor:pointer; box-shadow:0 4px 20px rgba(245,166,35,0.4);
  transition:transform .15s, box-shadow .15s; text-align:left; white-space:nowrap;
}
.btn-dl:hover { transform:translateY(-2px); box-shadow:0 6px 28px rgba(245,166,35,0.5); }
.btn-dl:disabled { opacity:.6; cursor:wait; }
</style>

<!-- ── Descarga: feed 1080×1350 (4:5) + historia 1080×1920 (9:16), 2x retina ── -->
<script>
(function () {
  var FILE = '2026-07-09-dia-independencia';
  var STORY_BG = '#05070d';   // bandas casi negras para que la placa navy resalte
  var SCALE = 2;              // 2x retina
  if (window.self !== window.top) return;  // no cargar en miniatura/iframe

  var bar = document.querySelector('.dlbar');
  bar.style.display = '';
  var s = document.createElement('script');
  s.src = 'https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js';
  document.head.appendChild(s);

  var botones = bar.querySelectorAll('.btn-dl');
  botones.forEach(function (b) {
    b.addEventListener('click', function () { descargar(b.getAttribute('data-fmt'), b); });
  });

  function bajar(canvas, nombre) {
    var a = document.createElement('a');
    a.download = nombre + '.png';
    a.href = canvas.toDataURL('image/png');
    a.click();
  }

  function descargar(fmt, btn) {
    var orig = btn.textContent;
    botones.forEach(function (b) { b.disabled = true; });
    btn.textContent = 'Generando…';
    document.fonts.ready.then(function () {
      var slide = document.querySelector('.slide');
      if (fmt === 'feed') {
        return html2canvas(slide, { scale: SCALE, useCORS: true, backgroundColor: null, width: 1080, height: 1350 })
          .then(function (c) { bajar(c, FILE + '-feed-1080x1350'); });
      }
      // Historia: la placa 4:5 centrada sobre un lienzo 9:16 de marca
      var frame = document.createElement('div');
      frame.style.cssText = 'position:fixed;left:-99999px;top:0;width:1080px;height:1920px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:' + STORY_BG + ';';
      var clone = slide.cloneNode(true);
      clone.style.boxShadow = '0 0 0 2px rgba(116,172,223,0.35)';
      frame.appendChild(clone);
      document.body.appendChild(frame);
      return html2canvas(frame, { scale: SCALE, useCORS: true, backgroundColor: null, width: 1080, height: 1920 })
        .then(function (c) { document.body.removeChild(frame); bajar(c, FILE + '-historia-1080x1920'); });
    }).then(function () {
      btn.textContent = orig;
      botones.forEach(function (b) { b.disabled = false; });
    }).catch(function (e) {
      console.error(e);
      btn.textContent = orig;
      botones.forEach(function (b) { b.disabled = false; });
    });
  }
})();
</script>
</body>
</html>
