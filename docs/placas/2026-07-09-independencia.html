<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HenderSeeds — Placa 9 de Julio · Día de la Independencia</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
:root {
  --navy:#0A0F1B; --navy-2:#0D2D5E; --cream:#F6F4EE;
  --orange:#F5A623; --celeste:#74ACDF; --white:#E8EEF7; --grey:#8FA0BE;
  --mono:'DM Mono',monospace; --sans:'DM Sans',sans-serif; --arch:'Archivo Black',sans-serif;
}
body { background:#05070d; display:flex; justify-content:center; align-items:flex-start; padding:20px; }
.slide {
  width:1080px; height:1350px; background:var(--navy);
  position:relative; overflow:hidden; padding:110px 90px 84px;
  display:flex; flex-direction:column; align-items:center; text-align:center; flex-shrink:0;
}
/* resplandor central sobrio, sin grilla: versión formal */
.slide::after {
  content:''; position:absolute; inset:0; pointer-events:none;
  background:
    radial-gradient(ellipse 700px 520px at 50% 36%, rgba(116,172,223,0.10), transparent 70%),
    radial-gradient(ellipse 900px 700px at 50% 110%, rgba(13,45,94,0.35), transparent 75%);
}
/* franja bandera arriba */
.flag { position:absolute; top:0; left:0; right:0; height:12px; display:flex; z-index:10; }
.flag span { flex:1; }
.flag .c { background:var(--celeste); }
.flag .b { background:#fff; }

.logo-hs { height:58px; z-index:2; }

.spacer { flex:1; }

/* sol de mayo flanqueado por filetes */
.emblema { display:flex; align-items:center; gap:34px; z-index:2; width:100%; justify-content:center; }
.emblema .linea { flex:1; max-width:250px; height:1px; background:linear-gradient(90deg, transparent, rgba(232,238,247,0.28)); }
.emblema .linea.der { background:linear-gradient(90deg, rgba(232,238,247,0.28), transparent); }
.sol { filter:drop-shadow(0 0 30px rgba(245,166,35,0.35)); }

.kicker {
  font-family:var(--mono); font-size:22px; letter-spacing:5px; text-transform:uppercase;
  color:var(--celeste); margin-top:52px; z-index:2;
}
.title { font-family:var(--arch); color:#fff; font-size:94px; line-height:1.08; letter-spacing:-2px; z-index:2; margin-top:22px; }
.title .hl { color:var(--celeste); }
.years { font-family:var(--mono); font-size:24px; letter-spacing:4px; color:var(--grey); margin-top:34px; z-index:2; }
.years b { color:var(--white); font-weight:500; }

.divisor { width:64px; height:1px; background:rgba(232,238,247,0.3); margin:44px auto 0; z-index:2; }

.lema {
  font-family:var(--sans); font-size:36px; font-weight:600; color:var(--white);
  line-height:1.5; margin-top:40px; max-width:800px; z-index:2;
}
.zona { font-family:var(--mono); font-size:20px; letter-spacing:4px; text-transform:uppercase; color:var(--grey); margin-top:46px; z-index:2; }

.firma { display:flex; flex-direction:column; align-items:center; gap:16px; z-index:2; width:100%; padding-top:30px; border-top:1px dashed rgba(232,238,247,0.16); }
.firma-row { display:flex; align-items:center; gap:16px; }
.firma-row img { height:30px; background:#fff; padding:6px 10px; border-radius:7px; }
.firma-row span { font-family:var(--mono); font-size:17px; letter-spacing:2px; color:var(--grey); text-transform:uppercase; }
.ig-min { font-family:var(--mono); font-size:18px; letter-spacing:1.5px; color:rgba(143,160,190,0.75); }
</style>
</head>
<body>
<div class="slide">
  <div class="flag"><span class="c"></span><span class="b"></span><span class="c"></span></div>

  <img class="logo-hs" src="../assets/logo-henderseeds-white.png" alt="HenderSeeds">

  <div class="spacer"></div>

  <!-- Sol de mayo entre filetes -->
  <div class="emblema">
    <div class="linea"></div>
    <svg class="sol" width="128" height="128" viewBox="0 0 100 100" fill="none" aria-hidden="true">
      <g stroke="#F5A623" stroke-width="2.4" stroke-linecap="round">
        <line x1="50" y1="4"  x2="50" y2="19"/>
        <line x1="50" y1="81" x2="50" y2="96"/>
        <line x1="4"  y1="50" x2="19" y2="50"/>
        <line x1="81" y1="50" x2="96" y2="50"/>
        <line x1="17.5" y1="17.5" x2="28" y2="28"/>
        <line x1="72" y1="72" x2="82.5" y2="82.5"/>
        <line x1="17.5" y1="82.5" x2="28" y2="72"/>
        <line x1="72" y1="28" x2="82.5" y2="17.5"/>
        <line x1="32" y1="7.6" x2="37.8" y2="21.4" stroke-width="1.7"/>
        <line x1="62.2" y1="78.6" x2="68" y2="92.4" stroke-width="1.7"/>
        <line x1="7.6" y1="68" x2="21.4" y2="62.2" stroke-width="1.7"/>
        <line x1="78.6" y1="37.8" x2="92.4" y2="32" stroke-width="1.7"/>
        <line x1="7.6" y1="32" x2="21.4" y2="37.8" stroke-width="1.7"/>
        <line x1="78.6" y1="62.2" x2="92.4" y2="68" stroke-width="1.7"/>
        <line x1="32" y1="92.4" x2="37.8" y2="78.6" stroke-width="1.7"/>
        <line x1="62.2" y1="21.4" x2="68" y2="7.6" stroke-width="1.7"/>
      </g>
      <circle cx="50" cy="50" r="20" stroke="#F5A623" stroke-width="2.8"/>
      <circle cx="50" cy="50" r="11" fill="#F5A623" opacity="0.9"/>
    </svg>
    <div class="linea der"></div>
  </div>

  <div class="kicker">9 de Julio · Día de la Independencia</div>
  <div class="title">Feliz Día de la<br><span class="hl">Independencia</span></div>
  <div class="years">1816 — 2026 · <b>210 años</b></div>

  <div class="divisor"></div>

  <div class="lema">El orgullo de trabajar la tierra argentina,<br>campaña tras campaña.</div>

  <div class="zona">Henderson · Daireaux · Bolívar</div>

  <div class="spacer"></div>

  <div class="firma">
    <div class="firma-row">
      <img src="../assets/logo-nidera.png" alt="Nidera Semillas">
      <span>RED.IN · Nidera Semillas</span>
    </div>
    <div class="ig-min">@henderseeds</div>
  </div>
</div>

<div class="dlbar" style="display:none">
  <button class="btn-dl" data-fmt="feed">Descargar feed &middot; 4:5</button>
  <button class="btn-dl" data-fmt="historia">Descargar historia &middot; 9:16</button>
</div>

<style>
.dlbar { position:fixed; bottom:24px; right:24px; z-index:9999; display:flex; flex-direction:column; gap:10px; }
.btn-dl {
  font-family:'DM Mono',monospace; font-size:14px; font-weight:500;
  background:#F5A623; color:#0A0F1B; border:none; border-radius:10px;
  padding:13px 22px; cursor:pointer; box-shadow:0 4px 20px rgba(245,166,35,0.4);
  transition:transform .15s, box-shadow .15s; text-align:left; white-space:nowrap;
}
.btn-dl:hover { transform:translateY(-2px); box-shadow:0 6px 28px rgba(245,166,35,0.5); }
.btn-dl:disabled { opacity:.6; cursor:wait; }
</style>

<!-- ── Descarga: feed 1080×1350 (4:5) + historia 1080×1920 (9:16), 2x retina ── -->
<script>
(function () {
  var FILE = '2026-07-09-dia-independencia';
  var STORY_BG = '#05070d';   // bandas casi negras para que la placa navy resalte
  var SCALE = 2;              // 2x retina
  if (window.self !== window.top) return;  // no cargar en miniatura/iframe

  var bar = document.querySelector('.dlbar');
  bar.style.display = '';
  var s = document.createElement('script');
  s.src = 'https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js';
  document.head.appendChild(s);

  var botones = bar.querySelectorAll('.btn-dl');
  botones.forEach(function (b) {
    b.addEventListener('click', function () { descargar(b.getAttribute('data-fmt'), b); });
  });

  function bajar(canvas, nombre) {
    var a = document.createElement('a');
    a.download = nombre + '.png';
    a.href = canvas.toDataURL('image/png');
    a.click();
  }

  function descargar(fmt, btn) {
    var orig = btn.textContent;
    botones.forEach(function (b) { b.disabled = true; });
    btn.textContent = 'Generando…';
    document.fonts.ready.then(function () {
      var slide = document.querySelector('.slide');
      if (fmt === 'feed') {
        return html2canvas(slide, { scale: SCALE, useCORS: true, backgroundColor: null, width: 1080, height: 1350 })
          .then(function (c) { bajar(c, FILE + '-feed-1080x1350'); });
      }
      // Historia: la placa 4:5 centrada sobre un lienzo 9:16 de marca
      var frame = document.createElement('div');
      frame.style.cssText = 'position:fixed;left:-99999px;top:0;width:1080px;height:1920px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:' + STORY_BG + ';';
      var clone = slide.cloneNode(true);
      clone.style.boxShadow = '0 0 0 2px rgba(116,172,223,0.35)';
      frame.appendChild(clone);
      document.body.appendChild(frame);
      return html2canvas(frame, { scale: SCALE, useCORS: true, backgroundColor: null, width: 1080, height: 1920 })
        .then(function (c) { document.body.removeChild(frame); bajar(c, FILE + '-historia-1080x1920'); });
    }).then(function () {
      btn.textContent = orig;
      botones.forEach(function (b) { b.disabled = false; });
    }).catch(function (e) {
      console.error(e);
      btn.textContent = orig;
      botones.forEach(function (b) { b.disabled = false; });
    });
  }
})();
</script>
</body>
</html>
