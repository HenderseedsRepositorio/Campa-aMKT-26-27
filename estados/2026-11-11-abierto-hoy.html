<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<title>Estado WhatsApp — Abierto hoy</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=DM+Mono:wght@500&family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* EDITAR HORARIOS ACÁ */
:root{--bg:#0A0F1B;--navy:#0D2D5E;--mid:#1A4A8A;--amb:#F5A623;--tx:#E8EEF7;--tx2:#8FA0BE;--wa:#25D366}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;background:var(--bg);color:var(--tx);font-family:'DM Sans',sans-serif;overflow:hidden;position:relative}
.glow{position:absolute;inset:0;background:radial-gradient(900px 700px at 85% 10%,rgba(26,74,138,.55),transparent 70%),radial-gradient(700px 600px at 0% 100%,rgba(13,45,94,.7),transparent 70%)}
.wrap{position:relative;height:100%;display:flex;flex-direction:column;padding:150px 90px 170px}
.logo{width:520px;}
.tag{margin-top:150px;font-family:'DM Mono',monospace;font-size:34px;letter-spacing:8px;text-transform:uppercase;color:var(--tx2);display:flex;align-items:center;gap:22px}
.dot{width:26px;height:26px;border-radius:50%;background:var(--wa);box-shadow:0 0 0 12px rgba(37,211,102,.18)}
h1{font-family:'Archivo Black',sans-serif;font-size:190px;line-height:.92;letter-spacing:-6px;margin-top:40px}
h1 span{color:var(--amb)}
.sub{font-size:44px;color:var(--tx2);margin-top:40px;line-height:1.3}
.turnos{margin-top:90px;display:flex;flex-direction:column;gap:34px}
.t{background:rgba(255,255,255,.04);border:2px solid rgba(143,160,190,.22);border-radius:36px;padding:44px 54px;display:flex;justify-content:space-between;align-items:center}
.t .l{font-family:'DM Mono',monospace;font-size:32px;letter-spacing:6px;text-transform:uppercase;color:var(--tx2)}
.t .h{font-family:'Archivo Black',sans-serif;font-size:76px;letter-spacing:-2px}
.cta{margin-top:auto;display:flex;align-items:center;gap:30px;font-size:42px;font-weight:600}
.cta b{color:var(--wa)}
.loc{font-family:'DM Mono',monospace;font-size:28px;letter-spacing:5px;color:var(--tx2);text-transform:uppercase;margin-top:28px}
</style></head><body><div class="glow"></div>
<div class="wrap">
  <img class="logo" src="_logo.png" alt="Henderseeds">
  <div class="tag"><i class="dot"></i>Hoy atendemos</div>
  <h1>Estamos<br><span>abiertos.</span></h1>
  <p class="sub">Horario normal, mañana y tarde.<br>Pasá o escribinos.</p>
  <div class="turnos">
    <div class="t"><span class="l">Mañana</span><span class="h">8 a 12 h</span></div>
    <div class="t"><span class="l">Tarde</span><span class="h">14 a 18 h</span></div>
  </div>
  <div class="cta">Consultas por acá mismo → <b>WhatsApp</b></div>
  <div class="loc">Henderson · Daireaux · Bolívar</div>
</div></body></html>
