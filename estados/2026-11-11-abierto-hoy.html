<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<title>Estado WhatsApp — Abierto hoy</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=DM+Mono:wght@500&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0A0F1B;--navy:#0D2D5E;--amb:#F5A623;--yel:#F59E0B;--tx:#E8EEF7;--tx2:#8FA0BE;--wa:#25D366}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;background:var(--bg);color:var(--tx);font-family:'DM Sans',sans-serif;overflow:hidden;position:relative}
.scene{position:absolute;left:0;top:0;width:1080px;height:880px}
.fade{position:absolute;left:0;top:660px;width:1080px;height:240px;background:linear-gradient(to bottom,rgba(10,15,27,0),var(--bg))}
.logo{position:absolute;top:110px;left:50%;transform:translateX(-50%);width:440px}
.content{position:absolute;left:0;right:0;top:720px;padding:0 90px;text-align:center}
.pill{display:inline-flex;align-items:center;gap:18px;padding:18px 34px;border-radius:999px;background:rgba(37,211,102,.12);border:2px solid rgba(37,211,102,.35);font-family:'DM Mono',monospace;font-size:28px;letter-spacing:6px;text-transform:uppercase;color:#7EE8A8}
.pill i{width:18px;height:18px;border-radius:50%;background:var(--wa);box-shadow:0 0 18px var(--wa)}
h1{font-family:'Archivo Black',sans-serif;font-size:104px;line-height:1;letter-spacing:-3px;margin-top:40px}
h1 span{color:var(--amb)}
.sub{font-size:42px;line-height:1.35;color:#C3CEE0;margin-top:34px}
.hours{margin-top:60px;display:grid;grid-template-columns:1fr 1fr;gap:28px}
.h{border-radius:40px;padding:44px 20px 40px;background:linear-gradient(160deg,rgba(26,74,138,.45),rgba(13,45,94,.25));border:2px solid rgba(143,160,190,.2)}
.h svg{width:84px;height:84px}
.h .l{font-family:'DM Mono',monospace;font-size:26px;letter-spacing:6px;text-transform:uppercase;color:var(--tx2);margin-top:16px}
.h .t{font-family:'Archivo Black',sans-serif;font-size:84px;letter-spacing:-3px;margin-top:10px;line-height:1}
.h .t small{font-size:40px;letter-spacing:-1px;color:var(--tx2);margin-left:6px}
.foot{position:absolute;left:0;right:0;bottom:110px;text-align:center}
.foot p{font-size:38px;font-weight:600}
.foot p b{color:var(--wa)}
.foot .loc{font-family:'DM Mono',monospace;font-size:24px;letter-spacing:6px;text-transform:uppercase;color:var(--tx2);margin-top:22px}
</style></head><body>

<svg class="scene" viewBox="0 0 1080 880" preserveAspectRatio="none">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A0F1B"/><stop offset=".38" stop-color="#0D2D5E"/>
      <stop offset=".62" stop-color="#1A4A8A"/><stop offset=".8" stop-color="#C9792A"/>
      <stop offset=".9" stop-color="#F5A623"/>
    </linearGradient>
    <radialGradient id="sun" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FFE3A3"/><stop offset=".45" stop-color="#F5A623"/><stop offset="1" stop-color="#F5A623" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B2436"/><stop offset="1" stop-color="#0A0F1B"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="880" fill="url(#sky)"/>
  <circle cx="540" cy="560" r="300" fill="url(#sun)" opacity=".9"/>
  <circle cx="540" cy="560" r="110" fill="#FFD27A"/>
  <path d="M0 560 L1080 560 L1080 880 L0 880 Z" fill="url(#field)"/>
  <rect x="0" y="558" width="1080" height="4" fill="#F5A623" opacity=".8"/>
  <g stroke="#F5A623" stroke-opacity=".28" stroke-width="3" fill="none">
    <path d="M540 562 L-400 880"/><path d="M540 562 L-120 880"/><path d="M540 562 L120 880"/>
    <path d="M540 562 L340 880"/><path d="M540 562 L540 880"/><path d="M540 562 L740 880"/>
    <path d="M540 562 L960 880"/><path d="M540 562 L1200 880"/><path d="M540 562 L1480 880"/>
  </g>
</svg>
<div class="fade"></div>
<img class="logo" src="_logo.png" alt="Henderseeds">

<div class="content">
  <div class="pill"><i></i>Abierto hoy</div>
  <h1>Hoy estamos,<br><span>como siempre.</span></h1>
  <p class="sub">Pasá a tomar unos mates y charlamos<br>de lo que necesites para tu campo.</p>
  <div class="hours">
    <div class="h">
      <svg viewBox="0 0 64 64" fill="none" stroke="#F5A623" stroke-width="4" stroke-linecap="round"><circle cx="32" cy="32" r="12" fill="#F5A623"/><path d="M32 6v8M32 50v8M6 32h8M50 32h8M13.6 13.6l5.6 5.6M44.8 44.8l5.6 5.6M13.6 50.4l5.6-5.6M44.8 19.2l5.6-5.6"/></svg>
      <div class="l">Mañana</div>
      <div class="t">8–12<small>hs</small></div>
    </div>
    <div class="h">
      <svg viewBox="0 0 64 64" fill="none" stroke="#F5A623" stroke-width="4" stroke-linecap="round"><path d="M16 42a16 16 0 0 1 32 0" fill="#F5A623"/><path d="M6 42h52M14 52h36M32 10v8M12 22l5 5M52 22l-5 5"/></svg>
      <div class="l">Tarde</div>
      <div class="t">15–19<small>hs</small></div>
    </div>
  </div>
</div>

<div class="foot">
  <p>¿No llegás? Escribinos <b>por acá</b> 💬</p>
  <div class="loc">Henderson · Daireaux · Bolívar</div>
</div>
</body></html>
