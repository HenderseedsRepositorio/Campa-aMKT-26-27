<!doctype html><html lang="es"><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=DM+Mono:wght@500&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box}body{width:1080px;height:1920px;overflow:hidden;position:relative;font-family:"DM Sans",sans-serif}.mono{font-family:"DM Mono",monospace;text-transform:uppercase}.ab{font-family:"Archivo Black",sans-serif}
body{background:#0A0F1B;color:#E8EEF7}
.sign{position:absolute;top:380px;left:90px;right:90px;bottom:330px;border-radius:60px;background:linear-gradient(170deg,#F5A623,#E8901A);color:#0A0F1B;padding:90px 80px;box-shadow:0 40px 120px rgba(245,166,35,.25)}
.hook{position:absolute;top:236px;left:50%;width:300px;height:170px;transform:translateX(-50%);border:6px solid #8FA0BE;border-bottom:none;border-radius:150px 150px 0 0}
.pin{position:absolute;top:216px;left:50%;transform:translateX(-50%);width:44px;height:44px;border-radius:50%;background:#8FA0BE}
.logo{position:absolute;top:56px;left:50%;transform:translateX(-50%);width:260px}
.k{font-size:30px;letter-spacing:8px;opacity:.75}
h1{font-size:158px;line-height:.9;letter-spacing:-6px;margin-top:30px}
.sub{font-size:44px;line-height:1.3;margin-top:40px;font-weight:500;max-width:780px}
.row{display:flex;justify-content:space-between;align-items:baseline;border-top:4px solid rgba(10,15,27,.25);padding-top:34px;margin-top:34px}
.row .l{font-size:30px;letter-spacing:6px}
.row .v{font-size:100px;letter-spacing:-3px;line-height:1}
.rows{position:absolute;left:80px;right:80px;bottom:90px}
.foot{position:absolute;bottom:150px;left:0;right:0;text-align:center;font-size:38px;font-weight:600}
.foot b{color:#25D366}
</style></head><body>
<img class="logo" src="_logo.png">
<div class="hook"></div><div class="pin"></div>
<div class="sign">
  <div class="k mono">Miércoles · Horario normal</div>
  <h1 class="ab">ABIERTO</h1><div class="ab" style="font-size:96px;letter-spacing:-3px;line-height:1;margin-top:6px">hoy.</div>
  <p class="sub">Mañana y tarde, como siempre. Acá te esperamos.</p>
  <div class="rows">
    <div class="row"><span class="l mono">Mañana</span><span class="v ab">8–12</span></div>
    <div class="row"><span class="l mono">Tarde</span><span class="v ab">15–19</span></div>
  </div>
</div>
<div class="foot">¿Consultas? <b>Escribinos por acá</b> 💬</div>
</body></html>
