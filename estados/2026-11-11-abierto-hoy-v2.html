<!doctype html><html lang="es"><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=DM+Mono:wght@500&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box}body{width:1080px;height:1920px;overflow:hidden;position:relative;font-family:"DM Sans",sans-serif}.mono{font-family:"DM Mono",monospace;text-transform:uppercase}.ab{font-family:"Archivo Black",sans-serif}
title{display:none}
body{background:#F6F4EE;color:#15181E}
.band{position:absolute;top:0;left:0;right:0;height:300px;background:#0D2D5E;display:flex;align-items:center;justify-content:center;border-radius:0 0 80px 80px}
.band img{width:420px}
.c{position:absolute;top:400px;left:90px;right:90px}
.tag{font-size:30px;letter-spacing:7px;color:#C9792A}
h1{font-size:150px;line-height:.92;letter-spacing:-5px;color:#0D2D5E;margin-top:30px}
h1 span{color:#F5A623}
.sub{font-size:44px;line-height:1.35;color:#4A5264;margin-top:40px}
.tl{margin-top:110px}
.bar{position:relative;height:120px;border-radius:60px;background:#EFEAE0;overflow:hidden}
.seg{position:absolute;top:0;bottom:0;background:linear-gradient(90deg,#F5A623,#F59E0B);display:flex;align-items:center;justify-content:center;color:#0D2D5E;font-size:56px}
.ticks{display:flex;justify-content:space-between;margin-top:22px;font-size:28px;letter-spacing:3px;color:#4A5264}
.lbl{display:flex;margin-top:60px;gap:30px}
.lbl>div{flex:1;background:#fff;border-radius:36px;padding:36px 40px;box-shadow:0 10px 30px rgba(13,45,94,.08)}
.lbl .k{font-size:26px;letter-spacing:6px;color:#8FA0BE}
.lbl .v{font-size:72px;letter-spacing:-2px;color:#0D2D5E;margin-top:8px}
.foot{position:absolute;bottom:120px;left:90px;right:90px;display:flex;align-items:center;gap:28px;background:#0D2D5E;color:#fff;border-radius:40px;padding:40px 46px;font-size:38px;font-weight:600}
.foot i{width:70px;height:70px;border-radius:50%;background:#25D366;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:38px;flex:none}
</style></head><body>
<div class="band"><img src="_logo.png"></div>
<div class="c">
  <div class="tag mono">Miércoles · Horario normal</div>
  <h1 class="ab">Buen día.<br><span>Abrimos.</span></h1>
  <p class="sub">La tranquera está abierta, como todos los días. Te esperamos.</p>
  <div class="tl">
    <div class="bar">
      <div class="seg mono" style="left:0;width:36.36%;font-size:28px;letter-spacing:5px">Mañana</div>
      <div class="seg mono" style="left:63.63%;width:36.37%;font-size:28px;letter-spacing:5px">Tarde</div>
    </div>
    <div class="ticks mono" style="position:relative;display:block;height:40px"><span style="position:absolute;left:0">8 hs</span><span style="position:absolute;left:36.36%;transform:translateX(-50%)">12</span><span style="position:absolute;left:63.63%;transform:translateX(-50%)">15</span><span style="position:absolute;right:0">19 hs</span></div>
  </div>
  <div class="lbl">
    <div><div class="k mono">Mañana</div><div class="v ab">8 a 12</div></div>
    <div><div class="k mono">Tarde</div><div class="v ab">15 a 19</div></div>
  </div>
</div>
<div class="foot"><i>💬</i>Si no podés venir, mandanos un mensaje por acá.</div>
</body></html>
