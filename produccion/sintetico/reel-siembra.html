<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>HenderSeeds — Reel Siembra 26/27 (motor de render)</title>
<!--
  Reel 1080×1920 animado por una sola función render(t) (t en segundos).
  No usa animaciones CSS: el script render-reel.mjs llama render(t) cuadro por cuadro,
  saca una captura de cada uno y ffmpeg los une en un MP4. Así el video sale nítido y
  exactamente igual cada vez.
  Para cambiar fotos: editar ESCENAS (campo img). Sirven fotos reales o generadas.
  Abrir este HTML en el navegador reproduce el reel en vivo (vista previa).
-->
<link rel="stylesheet" href="../../docs/assets/fonts/fuentes.css">
<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
:root {
  --navy:#0A0F1B; --orange:#F5A623; --white:#FFFFFF;
  --mono:'DM Mono',monospace; --sans:'DM Sans',sans-serif; --arch:'Archivo Black',sans-serif;
}
html, body { background:#000; }
#stage { width:1080px; height:1920px; position:relative; overflow:hidden; background:var(--navy); }

.scene { position:absolute; inset:0; opacity:0; }
.scene .ph { position:absolute; inset:-6%; background-size:cover; background-position:center; will-change:transform; }
.scene .shade { position:absolute; inset:0;
  background:linear-gradient(180deg, rgba(10,15,27,0.55) 0%, rgba(10,15,27,0) 18%, rgba(10,15,27,0) 40%, rgba(10,15,27,0.78) 68%, rgba(10,15,27,0.92) 100%); }

/* Texto: zona segura de Reels (arriba ~220 px de UI, abajo ~380 px, derecha ~150 px de íconos) */
.txt { position:absolute; left:80px; right:170px; bottom:440px; }
.kick { font-family:var(--mono); font-size:30px; letter-spacing:5px; text-transform:uppercase; color:var(--orange); display:flex; align-items:center; gap:14px; }
.kick .led { width:14px; height:14px; border-radius:50%; background:var(--orange); box-shadow:0 0 16px var(--orange); }
.big { font-family:var(--arch); font-size:104px; line-height:0.98; letter-spacing:-3px; color:var(--white); margin-top:22px; text-shadow:0 4px 30px rgba(0,0,0,0.35); }
.big .hl { color:var(--orange); }
.chip { display:inline-flex; align-items:center; gap:14px; margin-top:30px; font-family:var(--mono); font-weight:500; font-size:40px; letter-spacing:-0.5px; color:var(--navy); background:var(--orange); border-radius:12px; padding:14px 24px; }
.src { font-family:var(--mono); font-size:22px; color:rgba(255,255,255,0.6); margin-top:16px; letter-spacing:1px; }

/* Capa fija: marca arriba */
.top { position:absolute; top:190px; left:80px; right:80px; display:flex; justify-content:space-between; align-items:center; z-index:20; }
.top .tag { font-family:var(--mono); font-size:24px; letter-spacing:4px; color:var(--white); background:rgba(10,15,27,0.55); border:1px solid rgba(255,255,255,0.18); border-radius:999px; padding:10px 22px; display:flex; align-items:center; gap:12px; }
.top .tag i { width:10px; height:10px; border-radius:50%; background:var(--orange); display:block; }
.top img { height:62px; }
.ia { position:absolute; left:80px; bottom:330px; font-family:var(--mono); font-size:20px; letter-spacing:2px; color:rgba(255,255,255,0.5); z-index:20; }
.bar { position:absolute; left:0; top:0; height:10px; background:var(--orange); z-index:30; }

/* Cierre */
.outro { position:absolute; inset:0; opacity:0; background:var(--navy); display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:0 100px 120px; }
.outro::after { content:''; position:absolute; inset:0; pointer-events:none;
  background-image:linear-gradient(rgba(245,166,35,0.06) 1px, transparent 1px), linear-gradient(90deg, rgba(245,166,35,0.06) 1px, transparent 1px);
  background-size:72px 72px; }
.outro > * { position:relative; z-index:2; }
.outro .logo { height:120px; }
.outro .q { font-family:var(--arch); font-size:96px; line-height:1; letter-spacing:-3px; color:var(--white); margin-top:90px; }
.outro .dm { display:flex; align-items:center; gap:20px; font-family:var(--sans); font-weight:700; font-size:52px; color:var(--orange); margin-top:44px; }
.outro .redin { display:flex; align-items:center; gap:18px; margin-top:120px; font-family:var(--mono); font-size:24px; letter-spacing:2px; color:rgba(255,255,255,0.55); text-transform:uppercase; }
.outro .nid { position:relative; width:130px; height:72px; overflow:hidden; background:#fff; border-radius:10px; }
.outro .nid img { position:absolute; width:147px; left:-8.6px; top:-37.3px; }
.outro .wa { display:flex; align-items:center; gap:14px; margin-top:28px; font-family:var(--mono); font-size:30px; color:rgba(255,255,255,0.8); }
</style>
</head>
<body>
<div id="stage">
  <div id="scenes"></div>

  <div class="outro" id="outro">
    <img class="logo" src="../../docs/assets/logo-henderseeds-white.png" alt="HenderSeeds">
    <div class="q">¿Cómo viene<br>tu siembra?</div>
    <div class="dm">
      <svg viewBox="0 0 24 24" width="54" height="54" fill="none" stroke="#F5A623" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      Mandanos un DM
    </div>
    <div class="redin"><span class="nid"><img src="../../docs/assets/logo-nidera.png" alt="Nidera"></span> RED.IN · Nidera Semillas</div>
    <div class="wa">
      <svg viewBox="0 0 32 32" width="34" height="34" fill="#25D366"><path d="M16 .4C7.4.4.5 7.3.5 15.9c0 2.8.7 5.4 2 7.8L.4 31.6l8.1-2.1c2.3 1.2 4.8 1.9 7.5 1.9 8.6 0 15.5-7 15.5-15.5S24.6.4 16 .4zm0 28.3c-2.4 0-4.7-.6-6.7-1.8l-.5-.3-4.8 1.3 1.3-4.7-.3-.5c-1.3-2.1-2-4.5-2-7 0-7.2 5.9-13.1 13.1-13.1 3.5 0 6.8 1.4 9.3 3.8 2.5 2.5 3.8 5.8 3.8 9.3 0 7.2-5.9 13-13.2 13zm7.2-9.8c-.4-.2-2.3-1.1-2.7-1.3-.4-.1-.6-.2-.9.2-.3.4-1 1.3-1.2 1.5-.2.2-.4.3-.8.1-.4-.2-1.7-.6-3.2-2-1.2-1.1-2-2.4-2.2-2.8-.2-.4 0-.6.2-.8.2-.2.4-.4.6-.7.2-.2.3-.4.4-.7.1-.3.1-.5 0-.7-.1-.2-.9-2.2-1.3-3-.3-.8-.7-.7-.9-.7h-.8c-.3 0-.7.1-1.1.5-.4.4-1.4 1.4-1.4 3.4s1.5 3.9 1.7 4.2c.2.3 2.9 4.4 7 6.2 1 .4 1.8.7 2.4.9 1 .3 1.9.3 2.6.2.8-.1 2.3-.9 2.7-1.9.3-.9.3-1.7.2-1.9-.1-.2-.4-.3-.8-.5z"/></svg>
      WhatsApp 2314 53-0691
    </div>
  </div>

  <div class="top" id="top">
    <span class="tag"><i></i> SIEMBRA 26/27</span>
    <img src="../../docs/assets/logo-henderseeds-white.png" alt="HenderSeeds">
  </div>
  <div class="ia" id="ia">IMÁGENES GENERADAS CON IA · ILUSTRATIVAS</div>
  <div class="bar" id="bar"></div>
</div>

<script>
// Cada escena: foto, duración, movimiento de cámara (zoom y paneo, de inicio a fin) y texto.
var ESCENAS = [
  { img:'img/a1-sembradora.jpg', dur:4.0, z:[1.00, 1.10], px:[0, -2], py:[0, 0],
    html:'<div class="kick"><span class="led"></span>Oeste bonaerense</div><div class="big">La 26/27 ya<br>se está<br><span class="hl">sembrando.</span></div>' },
  { img:'img/a6-maiz.jpg', dur:3.6, z:[1.12, 1.00], px:[0, 0], py:[2, -1],
    html:'<div class="kick"><span class="led"></span>Maíz temprano</div><div class="big">Adentro.<br>Y naciendo.</div>' },
  { img:'img/a6-girasol.jpg', dur:4.2, z:[1.00, 1.12], px:[1, -1], py:[0, 0],
    html:'<div class="kick"><span class="led"></span>Girasol</div><div class="big">Arrancando.</div><div class="chip">Óptima 15/10 → 15/11</div><div class="src">Marbetes Nidera · Oeste de Buenos Aires</div>' },
  { img:'img/a7-cinta.jpg', dur:4.4, z:[1.08, 1.00], px:[-1, 1], py:[0, 0],
    html:'<div class="kick"><span class="led"></span>Después</div><div class="big">Contamos<br>plantas.</div><div class="chip">19,05 m × 1.000 = pl/ha</div>' },
  { img:'img/b3-atardecer.jpg', dur:4.0, z:[1.00, 1.08], px:[0, 0], py:[1, -1],
    html:'<div class="big">Para saber<br>cómo arrancó<br><span class="hl">cada lote.</span></div>' }
];
var OUTRO = 4.0, XF = 0.5;   // duración del cierre y del fundido entre escenas
var inicios = [], t0 = 0;
ESCENAS.forEach(function (e) { inicios.push(t0); t0 += e.dur; });
var T_OUTRO = t0, TOTAL = t0 + OUTRO;
window.REEL_DURACION = TOTAL;

var cont = document.getElementById('scenes');
var nodos = ESCENAS.map(function (e) {
  var d = document.createElement('div');
  d.className = 'scene';
  d.innerHTML = '<div class="ph" style="background-image:url(' + e.img + ')"></div><div class="shade"></div><div class="txt">' + e.html + '</div>';
  cont.appendChild(d);
  return d;
});

function clamp(v) { return Math.max(0, Math.min(1, v)); }
function ease(v) { v = clamp(v); return v < 0.5 ? 2 * v * v : 1 - Math.pow(-2 * v + 2, 2) / 2; }
function lerp(a, b, k) { return a + (b - a) * k; }

window.render = function (t) {
  ESCENAS.forEach(function (e, i) {
    var n = nodos[i], s = inicios[i], f = s + e.dur;
    var entra = i === 0 ? 1 : clamp((t - s) / XF);
    var sale = 1 - clamp((t - f) / XF);
    n.style.opacity = Math.min(entra, sale);
    n.style.zIndex = i + 1;
    var k = clamp((t - s) / (e.dur + XF));
    var ph = n.firstChild;
    ph.style.transform = 'translate(' + lerp(e.px[0], e.px[1], k) + '%,' + lerp(e.py[0], e.py[1], k) + '%) scale(' + lerp(e.z[0], e.z[1], k) + ')';
    // Texto: entra 0,25 s después de la escena, subiendo y apareciendo
    var tk = ease((t - s - 0.25) / 0.6);
    var txt = n.lastChild;
    txt.style.opacity = tk;
    txt.style.transform = 'translateY(' + (1 - tk) * 60 + 'px)';
  });
  var o = ease((t - T_OUTRO) / XF);
  var out = document.getElementById('outro');
  out.style.opacity = o; out.style.zIndex = 50;
  document.getElementById('top').style.opacity = 1 - o;
  document.getElementById('ia').style.opacity = 1 - o;
  document.getElementById('bar').style.width = (clamp(t / TOTAL) * 100) + '%';
};

// Vista previa en vivo si se abre en el navegador (el render por cuadros no usa esto)
if (!window.__RENDER_MODE__) {
  var arranque = null;
  (function loop(ts) {
    if (arranque === null) arranque = ts;
    window.render(((ts - arranque) / 1000) % TOTAL);
    requestAnimationFrame(loop);
  })(performance.now());
} else {
  window.render(0);
}
</script>
</body>
</html>
