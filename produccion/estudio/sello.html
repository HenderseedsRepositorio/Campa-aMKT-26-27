<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>HenderSeeds — Sello de cierre (5 s)</title>
<!--
  Plantilla "sello" del estudio (produccion/estudio/estudio.xml): 5 s para pegar al final de un video
  real del lote. La barra ámbar barre la pantalla y deja ver el logo real, la frase entra palabra por
  palabra y cierra con el sello RED.IN Nidera y el botón de DM.
  Logos: docs/assets/logo-hs-blanco-hd.png y logo-nidera-negativo.png, sin redibujar ni recolorear.
  Frase sobreescribible por URL: ?f=Lo seguimos de cerca.
  Render: node scripts/render-reel.mjs produccion/estudio/sello.html produccion/sintetico/out/sello.mp4
-->
<link rel="stylesheet" href="../../docs/assets/fonts/fuentes.css">
<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
:root { --navy:#0A0F1B; --orange:#F5A623; --ice:#E8EEF7; --steel:#8FA0BE;
  --mono:'DM Mono',monospace; --sans:'DM Sans',sans-serif; --arch:'Archivo Black',sans-serif; }
html, body { background:#000; }
#stage { width:1080px; height:1920px; position:relative; overflow:hidden; background:radial-gradient(ellipse 80% 55% at 50% 42%, #13203a 0%, #0A0F1B 72%); }
#stage::after { content:''; position:absolute; inset:0; pointer-events:none;
  background-image:linear-gradient(rgba(245,166,35,0.045) 1px, transparent 1px), linear-gradient(90deg, rgba(245,166,35,0.045) 1px, transparent 1px); background-size:72px 72px; }
.logo { position:absolute; left:50%; top:560px; width:640px; margin-left:-320px; z-index:3; }
.logo img { display:block; width:100%; }
.barra { position:absolute; top:0; bottom:0; width:1180px; left:0; background:var(--orange); z-index:5; }
.frase { position:absolute; left:110px; right:110px; top:910px; text-align:center; font-family:var(--arch); font-size:92px; line-height:1.02; letter-spacing:-3px; color:#fff; z-index:4; }
.frase span { display:inline-block; margin:0 0.12em; }
.sello { position:absolute; left:0; right:0; top:1180px; display:flex; align-items:center; justify-content:center; gap:26px; z-index:4; }
.sello .red { font-family:var(--mono); font-size:28px; letter-spacing:4px; color:var(--steel); text-transform:uppercase; }
.sello .sep { width:2px; height:64px; background:rgba(255,255,255,0.22); }
.sello img { height:84px; display:block; }
.dm { position:absolute; left:50%; top:1320px; transform:translateX(-50%); display:flex; align-items:center; gap:16px; font-family:var(--sans); font-weight:700; font-size:42px; color:#0A0A0A; background:var(--orange); border-radius:10px; padding:24px 40px; z-index:4; white-space:nowrap; }
.wa { position:absolute; left:0; right:0; top:1460px; display:flex; align-items:center; justify-content:center; gap:14px; font-family:var(--mono); font-size:30px; color:var(--ice); z-index:4; }
</style>
</head>
<body>
<div id="stage" data-sin-gancho>
  <div class="logo" id="logo"><img src="../../docs/assets/logo-hs-blanco-hd.png" alt="HenderSeeds"></div>
  <div class="barra" id="barra"></div>
  <div class="frase" id="frase"></div>
  <div class="sello" id="sello"><span class="red">Distribuidor RED.IN</span><span class="sep"></span><img src="../../docs/assets/logo-nidera-negativo.png" alt="Nidera Semillas"></div>
  <div class="dm" id="dm"><svg viewBox="0 0 24 24" width="44" height="44" fill="none" stroke="#0A0A0A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>Mandanos un DM</div>
  <div class="wa" id="wa"><svg viewBox="0 0 32 32" width="34" height="34" fill="#25D366"><path d="M16 .4C7.4.4.5 7.3.5 15.9c0 2.8.7 5.4 2 7.8L.4 31.6l8.1-2.1c2.3 1.2 4.8 1.9 7.5 1.9 8.6 0 15.5-7 15.5-15.5S24.6.4 16 .4zm0 28.3c-2.4 0-4.7-.6-6.7-1.8l-.5-.3-4.8 1.3 1.3-4.7-.3-.5c-1.3-2.1-2-4.5-2-7 0-7.2 5.9-13.1 13.1-13.1 3.5 0 6.8 1.4 9.3 3.8 2.5 2.5 3.8 5.8 3.8 9.3 0 7.2-5.9 13-13.2 13zm7.2-9.8c-.4-.2-2.3-1.1-2.7-1.3-.4-.1-.6-.2-.9.2-.3.4-1 1.3-1.2 1.5-.2.2-.4.3-.8.1-.4-.2-1.7-.6-3.2-2-1.2-1.1-2-2.4-2.2-2.8-.2-.4 0-.6.2-.8.2-.2.4-.4.6-.7.2-.2.3-.4.4-.7.1-.3.1-.5 0-.7-.1-.2-.9-2.2-1.3-3-.3-.8-.7-.7-.9-.7h-.8c-.3 0-.7.1-1.1.5-.4.4-1.4 1.4-1.4 3.4s1.5 3.9 1.7 4.2c.2.3 2.9 4.4 7 6.2 1 .4 1.8.7 2.4.9 1 .3 1.9.3 2.6.2.8-.1 2.3-.9 2.7-1.9.3-.9.3-1.7.2-1.9-.1-.2-.4-.3-.8-.5z"/></svg> WhatsApp 2314 53-0691</div>
</div>
<script>
var FRASE = new URLSearchParams(location.search).get('f') || 'Lo seguimos de cerca.';
function clamp(v) { return Math.max(0, Math.min(1, v)); }
function seg(t, a, b) { return clamp((t - a) / (b - a)); }
function eio(v) { v = clamp(v); return v < 0.5 ? 4 * v * v * v : 1 - Math.pow(-2 * v + 2, 3) / 2; }
// Resorte amortiguado: sobrepaso leve (~7 %) y asentamiento rápido. u = segundos desde que arranca.
function resorte(u, z, w) { if (u <= 0) return 0; z = z || 0.65; w = w || 13; var wd = w * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * w * u) * (Math.cos(wd * u) + z * w / wd * Math.sin(wd * u)); }

var fr = document.getElementById('frase');
fr.innerHTML = FRASE.split(' ').map(function (p) { return '<span>' + p + '</span>'; }).join('');
var palabras = Array.prototype.slice.call(fr.querySelectorAll('span'));
window.reajustar = function () { fr.style.fontSize = ''; var fs = 92; while (fr.scrollHeight > 230 && fs > 60) { fs -= 2; fr.style.fontSize = fs + 'px'; } };
window.reajustar(); if (document.fonts) document.fonts.ready.then(window.reajustar);

var TOTAL = 5.0;
window.REEL_DURACION = TOTAL;
window.render = function (t) {
  // 1 · la barra cruza y deja ver el logo (el borde de atrás de la barra es el borde del logo visible)
  var kb = eio(seg(t, 0.05, 1.0)), x = -1400 + kb * (1400 + 1300);   // de -1400 a 1300: con la inclinación, la barra sale entera
  document.getElementById('barra').style.transform = 'translateX(' + x + 'px) skewX(-8deg)';
  var logo = document.getElementById('logo'), borde = x - 220;   // 220 = de dónde arranca el logo en la pantalla
  var ver = clamp((borde + 60) / 640);
  logo.style.clipPath = 'inset(-10% ' + ((1 - ver) * 100).toFixed(2) + '% -10% 0)';
  var kl = resorte(t - 0.35);
  logo.style.transform = 'scale(' + (0.9 + 0.1 * kl) + ')';
  // 2 · la frase, palabra por palabra
  palabras.forEach(function (p, i) { var k = resorte(t - 1.25 - i * 0.16, 0.6, 14); p.style.opacity = clamp(k * 1.6); p.style.transform = 'translateY(' + (1 - k) * 46 + 'px)'; });
  // 3 · sello RED.IN Nidera, botón y WhatsApp
  var ks = resorte(t - 2.75), kd = resorte(t - 3.05, 0.55, 14), kw = resorte(t - 3.3);
  var se = document.getElementById('sello'); se.style.opacity = clamp(ks * 1.5); se.style.transform = 'translateY(' + (1 - ks) * 30 + 'px)';
  var dm = document.getElementById('dm'); dm.style.opacity = clamp(kd * 1.5); dm.style.transform = 'translateX(-50%) scale(' + (0.85 + 0.15 * kd) + ')';
  var wa = document.getElementById('wa'); wa.style.opacity = clamp(kw * 1.5); wa.style.transform = 'translateY(' + (1 - kw) * 20 + 'px)';
};
if (!window.__RENDER_MODE__) { var t0 = null; (function loop(ts) { if (t0 === null) t0 = ts; window.render(((ts - t0) / 1000) % TOTAL); requestAnimationFrame(loop); })(performance.now()); } else { window.render(0); }
</script>
</body>
</html>
